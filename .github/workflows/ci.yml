# Verify the application and development workflow against throwaway PostgreSQL.
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_DB: relay_test
          POSTGRES_USER: relay_test
          POSTGRES_PASSWORD: relay_test
        ports:
          - "55432:5432"
        options: >-
          --health-cmd "pg_isready -U relay_test -d relay_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.2"
      - name: Install the dependencies into .venv
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --requirement requirements-dev.txt
      - name: Verify
        run: |
          source .venv/bin/activate
          python src/manage.py check --settings=relay.settings.test
          ruff check . && ruff format --check . && pytest
