# Verify the application and site before separately controlled publication.
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_DB: relay_test
          POSTGRES_USER: relay_test
          POSTGRES_PASSWORD: relay_test
        ports:
          - "55432:5432"
        options: >-
          --health-cmd "pg_isready -U relay_test -d relay_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.2"
      - name: Install the dependencies into .venv
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --requirement requirements-dev.txt
      - name: Install Chromium and its system dependencies
        run: .venv/bin/python -m playwright install --with-deps chromium
      - name: Verify
        run: |
          source .venv/bin/activate
          python src/manage.py check --settings=relay.settings.test
          ruff check . && ruff format --check . && pytest --basetemp="$RUNNER_TEMP/relay-pytest"
      - name: Retain browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-failure-diagnostics
          path: |
            ${{ runner.temp }}/relay-pytest/**/browser-failure.png
            ${{ runner.temp }}/relay-pytest/**/browser-trace.zip
          if-no-files-found: ignore
          retention-days: 3

  site:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.2"
      - name: Build the existing Jekyll site
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1
        with:
          source: docs
          destination: _site
      - name: Check the rendered artifact
        run: python src/check_site.py _site --config docs/_config.yml
      - name: Upload only the checked artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, site]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Publish the checked artifact from this run
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  production:
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    needs: [verify, site]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    environment:
      name: production
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.2"
      - name: Install pinned runtime dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --requirement requirements.txt
      - name: Check and migrate
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DJANGO_PRODUCTION_HOST: ${{ vars.DJANGO_PRODUCTION_HOST }}
          DJANGO_TRUST_PROXY_SSL_HEADER: "true"
        run: .venv/bin/python src/release.py migrate
      - name: Deploy and smoke
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          DJANGO_PRODUCTION_HOST: ${{ vars.DJANGO_PRODUCTION_HOST }}
        run: .venv/bin/python src/release.py deploy
