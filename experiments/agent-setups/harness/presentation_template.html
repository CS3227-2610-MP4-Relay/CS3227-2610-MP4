<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Setups Experiment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --background: #ffffff;
  --foreground: #09090b;
  --card: #ffffff;
  --muted: #f4f4f5;
  --muted-foreground: #71717a;
  --border: #e4e4e7;
  --primary: #18181b;
  --primary-foreground: #fafafa;
  --ring: #a1a1aa;
  --grid: #e4e4e7;
  --s1: #2a78d6;
  --s2: #eb6834;
  --s3: #1baf7a;
  --radius: 0.75rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --background: #09090b;
    --foreground: #fafafa;
    --card: #111113;
    --muted: #1c1c1f;
    --muted-foreground: #a1a1aa;
    --border: #27272a;
    --primary: #fafafa;
    --primary-foreground: #18181b;
    --ring: #52525b;
    --grid: #27272a;
    --s1: #3987e5;
    --s2: #d95926;
    --s3: #199e70;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --background: #09090b;
  --foreground: #fafafa;
  --card: #111113;
  --muted: #1c1c1f;
  --muted-foreground: #a1a1aa;
  --border: #27272a;
  --primary: #fafafa;
  --primary-foreground: #18181b;
  --ring: #52525b;
  --grid: #27272a;
  --s1: #3987e5;
  --s2: #d95926;
  --s3: #199e70;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--background);
  color: var(--foreground);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: 17px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
code, pre { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.85em; }
code { background: var(--muted); border: 1px solid var(--border); border-radius: 6px; padding: 1px 6px; }
pre { background: var(--muted); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; overflow-x: auto; margin: 0; white-space: pre; }
.topbar {
  position: sticky; top: 0; z-index: 10;
  display: flex; align-items: center; gap: 12px;
  padding: 10px 24px; border-bottom: 1px solid var(--border);
  background: color-mix(in srgb, var(--background) 88%, transparent);
  backdrop-filter: blur(8px);
}
.topbar .brand { font-weight: 600; font-size: 15px; }
.topbar .spacer { flex: 1; }
.topbar .counter { color: var(--muted-foreground); font-size: 14px; font-variant-numeric: tabular-nums; }
.btn {
  font: inherit; font-size: 14px; font-weight: 500; cursor: pointer;
  height: 34px; padding: 0 12px; border-radius: 8px;
  border: 1px solid var(--border); background: var(--card); color: var(--foreground);
}
.btn:hover { background: var(--muted); }
.btn:focus-visible, [tabindex]:focus-visible, summary:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
.btn.primary { background: var(--primary); color: var(--primary-foreground); border-color: var(--primary); }
main { max-width: 1120px; margin: 0 auto; padding: 32px 24px 64px; }
.slide { display: none; animation: fade 0.25s ease; }
.slide.active { display: block; }
body.outline .slide { display: block; padding-bottom: 48px; margin-bottom: 48px; border-bottom: 1px solid var(--border); }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
h1 { font-size: clamp(32px, 5vw, 52px); line-height: 1.1; letter-spacing: -0.03em; margin: 8px 0 16px; }
h2 { font-size: clamp(24px, 3.4vw, 34px); letter-spacing: -0.02em; line-height: 1.2; margin: 4px 0 20px; }
.kicker { text-transform: uppercase; letter-spacing: 0.08em; font-size: 12px; font-weight: 600; color: var(--muted-foreground); margin: 0; }
.lead { font-size: 19px; color: var(--muted-foreground); max-width: 820px; margin: 0 0 28px; }
.title-slide { padding-top: 6vh; }
.grid { display: grid; gap: 16px; margin-bottom: 16px; }
.grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
@media (max-width: 860px) { .grid.two, .grid.three, .grid.four { grid-template-columns: 1fr; } }
.card {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 20px 22px; margin-bottom: 16px;
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
}
.grid > .card { margin-bottom: 0; }
.card-title { font-weight: 600; margin: 0 0 8px; }
.card ul { margin: 6px 0 0; padding-left: 20px; }
.card li { margin: 4px 0; }
.stat-value { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; margin: 0; font-variant-numeric: tabular-nums; }
.stat-label { margin: 2px 0 0; font-weight: 500; }
.muted { color: var(--muted-foreground); }
.small { font-size: 14px; }
.badge {
  display: inline-block; font-size: 12px; font-weight: 600; line-height: 1;
  padding: 5px 9px; border-radius: 999px; border: 1px solid var(--border);
  background: var(--muted); white-space: nowrap;
}
.item { margin: 8px 0; font-size: 15px; }
table { width: 100%; border-collapse: collapse; font-size: 15px; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
th { color: var(--muted-foreground); font-weight: 500; font-size: 13px; }
table.small { font-size: 13px; }
table.wide { margin-bottom: 16px; }
.scroll { max-height: 64vh; overflow: auto; border: 1px solid var(--border); border-radius: var(--radius); }
details { margin-top: 12px; }
summary { cursor: pointer; color: var(--muted-foreground); font-size: 14px; }
.flow { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; }
.flow.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
@media (max-width: 860px) { .flow { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.step { border: 1px solid var(--border); border-radius: 10px; padding: 12px; background: var(--muted); }
.step p { margin: 8px 0 0; font-size: 14px; line-height: 1.4; }
.chart { width: 100%; height: auto; display: block; }
.chart text { font-family: inherit; fill: var(--muted-foreground); font-size: 13px; }
.chart .label { fill: var(--foreground); font-size: 14px; }
.chart .label.strong, .chart .value { fill: var(--foreground); font-weight: 600; }
.chart .grid { stroke: var(--grid); stroke-width: 1; }
.chart .grid.base { stroke: var(--muted-foreground); stroke-dasharray: 4 4; }
.chart .range { stroke: var(--s1); stroke-width: 2; stroke-linecap: round; opacity: 0.45; }
.chart .dot { fill: var(--s1); stroke: var(--card); stroke-width: 2; cursor: default; }
.chart .dot.strong { fill: var(--foreground); }
.chart .s1 { fill: var(--s1); } .chart .s2 { fill: var(--s2); } .chart .s3 { fill: var(--s3); }
.chart .seg-label { fill: var(--foreground); font-weight: 500; }
.chart rect:hover, .chart circle:hover { opacity: 0.85; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 8px; font-size: 14px; }
.legend .key { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.legend i.s1 { background: var(--s1); } .legend i.s2 { background: var(--s2); } .legend i.s3 { background: var(--s3); }
.tooltip {
  position: fixed; z-index: 20; pointer-events: none; display: none;
  background: var(--primary); color: var(--primary-foreground);
  font-size: 13px; padding: 6px 10px; border-radius: 8px; max-width: 320px;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.18);
}
.dots { display: flex; gap: 6px; justify-content: center; margin-top: 8px; }
.dots button { width: 8px; height: 8px; padding: 0; border-radius: 99px; border: 0; background: var(--border); cursor: pointer; }
.dots button.on { background: var(--foreground); }
body.outline .dots { display: none; }
@media (max-width: 600px) {
  .topbar { padding: 10px 16px; flex-wrap: wrap; }
  main { padding: 20px 16px 48px; }
}
@media print {
  .topbar, .dots { display: none; }
  .slide { display: block !important; page-break-after: always; }
}
</style>
</head>
<body>
<header class="topbar">
  <span class="brand">Agent setups · #31</span>
  <span class="spacer"></span>
  <span class="counter" id="counter"></span>
  <button class="btn" id="prev" aria-label="Previous slide">←</button>
  <button class="btn primary" id="next" aria-label="Next slide">→</button>
  <button class="btn" id="outline">All slides</button>
  <button class="btn" id="theme" aria-label="Toggle theme">Theme</button>
</header>
<main id="deck">
<!--SLIDES-->
<div class="dots" id="dots"></div>
</main>
<div class="tooltip" id="tip" role="tooltip"></div>
<script>
(function () {
  var slides = Array.prototype.slice.call(document.querySelectorAll(".slide"));
  var counter = document.getElementById("counter");
  var dots = document.getElementById("dots");
  var index = 0;
  slides.forEach(function (_, i) {
    var b = document.createElement("button");
    b.setAttribute("aria-label", "Slide " + (i + 1));
    b.addEventListener("click", function () { show(i); });
    dots.appendChild(b);
  });
  function show(i) {
    index = Math.max(0, Math.min(slides.length - 1, i));
    slides.forEach(function (s, j) { s.classList.toggle("active", j === index); });
    Array.prototype.forEach.call(dots.children, function (d, j) { d.classList.toggle("on", j === index); });
    counter.textContent = (index + 1) + " / " + slides.length;
    if (location.hash !== "#" + (index + 1)) history.replaceState(null, "", "#" + (index + 1));
    window.scrollTo(0, 0);
  }
  document.getElementById("prev").addEventListener("click", function () { show(index - 1); });
  document.getElementById("next").addEventListener("click", function () { show(index + 1); });
  document.getElementById("outline").addEventListener("click", function () {
    var on = document.body.classList.toggle("outline");
    this.textContent = on ? "Slides" : "All slides";
  });
  document.getElementById("theme").addEventListener("click", function () {
    var root = document.documentElement;
    var dark = root.getAttribute("data-theme") === "dark" ||
      (!root.getAttribute("data-theme") && matchMedia("(prefers-color-scheme: dark)").matches);
    root.setAttribute("data-theme", dark ? "light" : "dark");
  });
  document.addEventListener("keydown", function (e) {
    if (e.target.tagName === "INPUT" || document.body.classList.contains("outline")) return;
    if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") { e.preventDefault(); show(index + 1); }
    if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); show(index - 1); }
    if (e.key === "Home") show(0);
    if (e.key === "End") show(slides.length - 1);
  });
  var tip = document.getElementById("tip");
  function place(e, text) {
    tip.textContent = text;
    tip.style.display = "block";
    var x = e.clientX + 14, y = e.clientY + 14;
    if (x + tip.offsetWidth > innerWidth - 8) x = e.clientX - tip.offsetWidth - 14;
    tip.style.left = x + "px";
    tip.style.top = y + "px";
  }
  document.querySelectorAll("[data-tip]").forEach(function (el) {
    el.addEventListener("mousemove", function (e) { place(e, el.getAttribute("data-tip")); });
    el.addEventListener("mouseleave", function () { tip.style.display = "none"; });
    el.addEventListener("focus", function () {
      var r = el.getBoundingClientRect();
      place({ clientX: r.right, clientY: r.top }, el.getAttribute("data-tip"));
    });
    el.addEventListener("blur", function () { tip.style.display = "none"; });
  });
  var start = parseInt((location.hash || "#1").slice(1), 10) - 1;
  show(isNaN(start) ? 0 : start);
})();
</script>
</body>
</html>
