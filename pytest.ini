[pytest]
# Application tests will live beside code under src/; the workflow's own tests
# are the unittest-style test_*.py in workflow/scripts.
testpaths = src workflow/scripts
pythonpath = src
# Add explicit test-only Django settings when the application is scaffolded.
django_find_project = false
strict_config = true
strict_markers = true
markers =
    ac(*ids): the acceptance criteria a test checks, by spec ID, such as ac("PLT-1.2")
