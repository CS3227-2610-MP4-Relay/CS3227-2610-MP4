[pytest]
# Application tests live beside code under src/; the workflow's own tests
# are the unittest-style test_*.py in workflow/scripts.
testpaths = src workflow/scripts
pythonpath = src
# CLI precedence prevents an inherited settings module selecting runtime settings.
addopts = --ds=relay.settings.test --liveserver=127.0.0.1:0
django_find_project = false
strict_config = true
strict_markers = true
markers =
    ac(*ids): the acceptance criteria a test checks, by spec ID, such as ac("PLT-1.2")
    prompt_injection: deterministic fake-provider regressions for existing AI trust boundaries
    llm_transport: the test may open the LLM gateway transport, to a local server only
